# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: ^.releaserc\.json$

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-json
    -   id: check-merge-conflict
    -   id: check-added-large-files
    -   id: pretty-format-json
        args:
        - --autofix
        - --indent
        - "4"
-   repo: local
    hooks:
    -   id: check-unique-author-ids
        name: Check unique author IDs
        entry: >-
            jq -e 'group_by(.id) | map(select(length > 1) | .[0].id) |
            if length == 0 then true else
            error("duplicate author IDs: \(join(", "))") end'
            authors/authors.json
        language: system
        pass_filenames: false
        files: ^authors/authors\.json$
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 0.38.2
  hooks:
    - id: check-jsonschema
      name: Validate authors.json
      files: ^authors/authors\.json$
      args:
        - --schemafile
        - schema/author.schema.json
