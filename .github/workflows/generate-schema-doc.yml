name: Generate schema documentation

on:
  push:
    branches:
      - main
      - alpha

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-schema-doc:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install generator
        run: python -m pip install json-schema-for-humans

      - name: Generate schema.html
        run: |
          generate-schema-doc \
            --config template_name=js \
            --config expand_buttons=true \
            schema/author.schema.json \
            schema.html

      - name: Create schema documentation pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SCHEMA_DOCS_PAT }}
          base: ${{ github.ref_name }}
          branch: automation/schema-docs-${{ github.ref_name }}
          delete-branch: true
          commit-message: "docs: regenerate schema.html"
          title: "docs: regenerate schema.html"
          body: |
            Automatically generated schema documentation for `${{ github.ref_name }}`.
          add-paths: |
            schema.html
